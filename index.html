<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NABs EMCALA · GBA Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: noche de góndola con burbujas → wordmark NABs + tarjetas de color por herramienta */
:root{
  --night:#0a1430; --night2:#10224d; --ink:#ffffff; --muted:rgba(255,255,255,.66);
  --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --fizz:#38c8ff; --heat:#ff4d6d; --sun:#ffc93c; --lime:#7ee081; --aqua:#2de0c5; --tang:#ff8a3d;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--night);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(700px 500px at 88% -5%, rgba(56,200,255,.35), transparent 65%),
    radial-gradient(600px 480px at -5% 105%, rgba(255,77,109,.28), transparent 65%),
    linear-gradient(160deg,var(--night2),var(--night) 60%)}
#fizz{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:32px 48px}

/* Wordmark */
.brand{text-align:center}
.brand .nabs{font-family:var(--display);font-weight:900;font-size:clamp(52px,11vw,88px);line-height:.9;letter-spacing:-.02em;margin:0}
.brand .nabs span{background:linear-gradient(90deg,var(--fizz),var(--aqua));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{display:inline-flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.2em}
.brand .tag i{width:7px;height:7px;border-radius:50%;background:var(--heat);display:inline-block}
.brand.sm .nabs{font-size:clamp(40px,7vw,56px)}

/* Login */
#login{min-height:calc(100vh - 80px);display:grid;place-items:center;align-content:center;gap:28px}
.card{width:100%;max-width:380px;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:26px;display:grid;gap:8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h2{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--muted);text-align:center}
.card label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-top:6px}
.card input{font:600 16px var(--body);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.card input:focus{outline:none;border-color:var(--fizz);box-shadow:0 0 0 3px rgba(56,200,255,.25)}
.btn-in{margin-top:12px;font:800 15px var(--display);letter-spacing:.04em;border:0;border-radius:14px;padding:15px;color:var(--night);cursor:pointer;
  background:linear-gradient(90deg,var(--fizz),var(--aqua));transition:transform .15s,filter .15s}
.btn-in:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn-in:disabled{opacity:.7;cursor:wait}
.err{min-height:18px;font-size:13px;font-weight:600;color:var(--heat);text-align:center}

/* Hub */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.top .brand{text-align:left}
.hello{font-size:15px;color:var(--muted)}
.hello b{color:var(--ink);font-weight:700}
.sec{margin-top:26px}
.sec h3{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.22em;color:var(--muted);margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{--c:var(--fizz);position:relative;overflow:hidden;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--body);
  background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px;min-height:128px;
  display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:transform .18s,border-color .18s,background .18s}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.18;transition:opacity .18s,transform .25s}
.tile:hover{transform:translateY(-3px);border-color:var(--c);background:rgba(255,255,255,.1)}
.tile:hover::after{opacity:.32;transform:scale(1.15)}
.tile:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.tile .dot{width:34px;height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center;color:var(--night);font:900 13px var(--display)}
.tile .name{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.01em;display:block}
.tile .sub{display:block;padding-right:26px;font-size:13px;color:var(--muted);margin-top:4px}
.tile .go{position:absolute;right:16px;bottom:16px;font-size:18px;color:var(--c)}
.out{margin-top:34px;display:flex;justify-content:center}
.out button{font:600 14px var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:10px 22px;cursor:pointer}
.out button:hover{color:var(--ink);border-color:var(--ink)}
.toast{position:fixed;z-index:5;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--night);font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:1fr}.top{justify-content:center}.top .brand{text-align:center}.hello{width:100%;text-align:center}}
@media (prefers-reduced-motion:reduce){.tile,.tile::after,.btn-in{transition:none}#fizz{display:none}}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="fizz" aria-hidden="true"></canvas>

<main class="wrap">
  <section id="login">
    <div class="brand">
      <p class="nabs">NAB<span>s</span></p>
      <div class="tag">EMCALA <i></i> GBA NORTE</div>
    </div>
    <form class="card" id="f" autocomplete="off">
      <h2>Ingresá para ver tus herramientas</h2>
      <label for="u">USUARIO</label>
      <input id="u" autocapitalize="characters">
      <label for="p">CONTRASEÑA</label>
      <input id="p" type="password">
      <button class="btn-in" id="go" type="submit">INGRESAR</button>
      <div class="err" id="err"></div>
    </form>
  </section>

  <section id="hub" hidden>
    <div class="top">
      <div class="brand sm">
        <p class="nabs">NAB<span>s</span></p>
        <div class="tag">EMCALA <i></i> GBA NORTE</div>
      </div>
      <div class="hello">Hola, <b id="whoName">NABS</b> 👋 ¿Qué vamos a mover hoy?</div>
    </div>

    <div class="sec">
      <h3>OBJETIVOS</h3>
      <div class="tiles">
        <button class="tile" data-k="grillas" style="--c:var(--fizz)"><span class="dot">G</span><span><span class="name">Grillas</span><span class="sub">Objetivo por mesa, promotor y día</span></span><span class="go">→</span></button>
        <button class="tile" data-k="objetivos" style="--c:var(--sun)"><span class="dot">O</span><span><span class="name">Objetivos del mes</span><span class="sub">HL por unidad de negocio</span></span><span class="go">→</span></button>
        <button class="tile" data-k="cierres" style="--c:var(--heat)"><span class="dot">C</span><span><span class="name">Cierres</span><span class="sub">% de cumplimiento por promotor</span></span><span class="go">→</span></button>
      </div>
    </div>

    <div class="sec">
      <h3>EJECUCIÓN EN EL PDV</h3>
      <div class="tiles">
        <button class="tile" data-k="ptc" style="--c:var(--lime)"><span class="dot">$</span><span><span class="name">PTC</span><span class="sub">Precio al consumidor</span></span><span class="go">→</span></button>
        <button class="tile" data-k="ptr" style="--c:var(--aqua)"><span class="dot">%</span><span><span class="name">PTR</span><span class="sub">Escalas al minorista</span></span><span class="go">→</span></button>
      </div>
    </div>

    <div class="sec">
      <h3>PRODUCTO</h3>
      <div class="tiles">
        <button class="tile" data-k="frescura" style="--c:var(--fizz)"><span class="dot">F</span><span><span class="name">Frescura</span><span class="sub">Vencimientos de lote por SKU</span></span><span class="go">→</span></button>
        <button class="tile" data-k="combos" style="--c:var(--tang)"><span class="dot">+</span><span><span class="name">Combos</span><span class="sub">Combos habilitados del mes</span></span><span class="go">→</span></button>
      </div>
    </div>

    <div class="out"><button id="out">Cerrar sesión</button></div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
/* Burbujas de fondo */
(function(){
  const c=document.getElementById("fizz"), x=c.getContext("2d");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W,H,B=[];
  function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}
  size(); addEventListener("resize",size);
  for(let i=0;i<38;i++) B.push({x:Math.random(),y:Math.random(),r:2+Math.random()*7,s:.0006+Math.random()*.0016,w:Math.random()*6});
  (function f(){
    x.clearRect(0,0,W,H);
    for(const b of B){
      b.y-=b.s; b.w+=.02; if(b.y<-.05){b.y=1.05;b.x=Math.random()}
      const px=(b.x+Math.sin(b.w)*.004)*W, py=b.y*H, r=b.r*devicePixelRatio;
      x.beginPath(); x.arc(px,py,r,0,7); x.strokeStyle="rgba(255,255,255,.22)"; x.lineWidth=devicePixelRatio; x.stroke();
    }
    requestAnimationFrame(f);
  })();
})();

/* Links encriptados con usuario+contraseña. Para cambiarlos usá editor.html (no se sube) */
const PAYLOAD = {"iter":150000,"salt":"oDf/SsVP4Iwz8g/d/hvV1Q==","iv":"/Z6HxyD+MiiynQMU","data":"hy6POKZ4ljvNBQ/zsByZCD3PXdYjPz5R4BH5JmCgFjVdRxAldoxJwRci3Pam/SKv3UjuUhgkAoP9HxcjSv4HVoszQZ5zS5OR9x+JmQFe9SRXLWqQJx3pFRMHf9VrGUKL/iOKyaVDdEAUUh9blZKVPE2770d3nK61DtqjqOrapf7w4MoHs3kxT93pDgvoacDF4rFwhoeTDcCpkhI="};

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let LINKS = {};

async function decrypt(user, pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(user + ":" + pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function show(user){ $("login").hidden = true; $("hub").hidden = false; $("whoName").textContent = user; }
async function tryLogin(u, p, silent){
  try { const d = await decrypt(u, p); LINKS = d.links || {}; show(u);
        try{ sessionStorage.setItem("nabs", JSON.stringify([u,p])) }catch(e){}
  } catch(e){ if(!silent) $("err").textContent = "Usuario o contraseña incorrectos"; }
}
try { const s = JSON.parse(sessionStorage.getItem("nabs")||"null"); if (s) tryLogin(s[0], s[1], true); } catch(e){}

$("f").addEventListener("submit", async e => {
  e.preventDefault(); $("err").textContent = "";
  $("go").textContent = "VERIFICANDO…"; $("go").disabled = true;
  await tryLogin($("u").value.trim().toUpperCase(), $("p").value);
  $("go").textContent = "INGRESAR"; $("go").disabled = false;
});
$("out").addEventListener("click", () => { try{sessionStorage.removeItem("nabs")}catch(e){} LINKS = {}; $("p").value=""; $("hub").hidden = true; $("login").hidden = false; });

let t;
document.querySelectorAll(".tile[data-k]").forEach(b => b.addEventListener("click", () => {
  const url = LINKS[b.dataset.k];
  if (url) { window.open(url, "_blank", "noopener"); return; }
  $("toast").textContent = b.querySelector(".name").textContent + ": link pendiente de cargar";
  $("toast").hidden = false; clearTimeout(t); t = setTimeout(() => $("toast").hidden = true, 2200);
}));
</script>
</body>
</html>
